[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-efficiency"
version = "0.1.0"
description = "KV caching and LoRA implementations in a small minGPT decoder"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0,<3",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
pretrained = ["transformers>=4,<5"]
notebook = [
    "jupyter",
]
[tool.hatch.build.targets.wheel]
packages = ["mingpt", "kv_cache", "lora"]
